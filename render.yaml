databases:
  - name: selfmanager-db
    plan: free
    databaseName: psocial_selfmanager
    user: psocial

  - name: timer-db
    plan: free
    databaseName: psocial_timer
    user: psocial

  - name: billing-db
    plan: free
    databaseName: psocial_billing
    user: psocial

  - name: analytics-db
    plan: free
    databaseName: psocial_analytics
    user: psocial

services:

  - type: web
    name: selfmanager
    env: docker
    plan: free
    dockerfilePath: ./psocial_selfmanager/Dockerfile
    dockerContext: ./psocial_selfmanager
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: selfmanager-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: selfmanager-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: selfmanager-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: selfmanager-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: selfmanager-db
          property: database
      - key: USER_REGISTRY_DB_HOST
        fromDatabase:
          name: selfmanager-db
          property: host
      - key: USER_REGISTRY_DB_PORT
        fromDatabase:
          name: selfmanager-db
          property: port
      - key: USER_REGISTRY_DB_NAME
        fromDatabase:
          name: selfmanager-db
          property: database
      - key: USER_REGISTRY_DB_USER
        fromDatabase:
          name: selfmanager-db
          property: user
      - key: USER_REGISTRY_DB_PASSWORD
        fromDatabase:
          name: selfmanager-db
          property: password
      - key: JWT_SECRET
        value: your-super-secret-jwt-secret-key-change-in-production
      - key: JWT_ISSUER
        value: ktor-psocial-app
      - key: JWT_AUDIENCE
        value: ktor-psocial
      - key: JWT_REALM
        value: ktor-psocial
      - key: INTERNAL_API_KEY
        value: psocial-internal-secret
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: BILLING_SERVICE_URL
        fromService:
          name: billing
          type: web
          property: url
      - key: TIMER_SERVICE_URL
        fromService:
          name: timer
          type: web
          property: url

  - type: web
    name: timer
    env: docker
    plan: free
    dockerfilePath: ./psocial_timer/Dockerfile
    dockerContext: ./psocial_timer
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: timer-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: timer-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: timer-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: timer-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: timer-db
          property: database
      - key: USER_REGISTRY_DB_HOST
        fromDatabase:
          name: selfmanager-db
          property: host
      - key: USER_REGISTRY_DB_PORT
        fromDatabase:
          name: selfmanager-db
          property: port
      - key: USER_REGISTRY_DB_NAME
        fromDatabase:
          name: selfmanager-db
          property: database
      - key: USER_REGISTRY_DB_USER
        fromDatabase:
          name: selfmanager-db
          property: user
      - key: USER_REGISTRY_DB_PASSWORD
        fromDatabase:
          name: selfmanager-db
          property: password
      - key: JWT_SECRET
        value: your-super-secret-jwt-secret-key-change-in-production
      - key: JWT_ISSUER
        value: ktor-psocial-app
      - key: JWT_AUDIENCE
        value: ktor-psocial
      - key: JWT_REALM
        value: ktor-psocial
      - key: INTERNAL_API_KEY
        value: psocial-internal-secret
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SERVICES_SERVICE_URL
        fromService:
          name: selfmanager
          type: web
          property: url

  - type: web
    name: analytics
    env: docker
    plan: free
    dockerfilePath: ./psocial_analytics/Dockerfile
    dockerContext: ./psocial_analytics
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: analytics-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: analytics-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: analytics-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: analytics-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: analytics-db
          property: database
      - key: JWT_SECRET
        value: your-super-secret-jwt-secret-key-change-in-production
      - key: JWT_ISSUER
        value: ktor-psocial-app
      - key: JWT_AUDIENCE
        value: ktor-psocial
      - key: JWT_REALM
        value: ktor-psocial
      - key: INTERNAL_API_KEY
        value: psocial-internal-secret
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: BILLING_SERVICE_URL
        fromService:
          name: billing
          type: web
          property: url
      - key: SELFMANAGER_SERVICE_URL
        fromService:
          name: selfmanager
          type: web
          property: url
      - key: TIMER_SERVICE_URL
        fromService:
          name: timer
          type: web
          property: url

  - type: web
    name: billing
    env: docker
    plan: free
    dockerfilePath: ./psocial_billing_service/Dockerfile
    dockerContext: ./psocial_billing_service
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: billing-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: billing-db
          property: connectionString
      - key: JWT_SECRET_KEY
        value: your-super-secret-jwt-secret-key-change-in-production
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: INTERNAL_API_KEY
        value: psocial-internal-secret
      - key: APP_ENV
        value: production
      - key: DEFAULT_CREDITS_ON_REGISTER
        value: "100"
      - key: DEFAULT_LLM_PROVIDER
        value: anthropic
      - key: SELFMANAGER_BASE_URL
        fromService:
          name: selfmanager
          type: web
          property: url

  - type: web
    name: dashboard
    env: docker
    plan: free
    dockerfilePath: ./psocial_dashboard/Dockerfile
    dockerContext: ./psocial_dashboard
    envVars:
      - key: BILLING_URL
        fromService:
          name: billing
          type: web
          property: url
      - key: SELFMANAGER_URL
        fromService:
          name: selfmanager
          type: web
          property: url
      - key: ANALYTICS_URL
        fromService:
          name: analytics
          type: web
          property: url

  - type: web
    name: user-dashboard
    env: docker
    plan: free
    dockerfilePath: ./psocial_user_dashboard/Dockerfile
    dockerContext: ./psocial_user_dashboard
    envVars:
      - key: BILLING_URL
        fromService:
          name: billing
          type: web
          property: url
      - key: SELFMANAGER_URL
        fromService:
          name: selfmanager
          type: web
          property: url
      - key: ANALYTICS_URL
        fromService:
          name: analytics
          type: web
          property: url
      - key: TIMER_URL
        fromService:
          name: timer
          type: web
          property: url
